<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <!-- Background -->
  <rect width="1200" height="800" rx="20" fill="#0b0b0e"/>
  <rect x="0.5" y="0.5" width="1199" height="799" rx="19.5" stroke="#2b2d31" stroke-width="1"/>

  <!-- Background decorative technical grid -->
  <g opacity="0.15">
    <line x1="200" y1="0" x2="200" y2="800" stroke="#2b2d31" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="1000" y1="0" x2="1000" y2="800" stroke="#2b2d31" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#2b2d31" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Left info panel on canvas -->
  <text x="80" y="240" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="500" letter-spacing="-0.02em">Fila Digital CadÚnico</text>
  <text x="80" y="270" fill="#c72c3b" font-family="monospace" font-size="12" letter-spacing="0.15em">GESTÃO DE FILAS MUNICIPAL</text>
  <text x="80" y="320" fill="#8a8f98" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="300" max-width="260">
    <tspan x="80" dy="0">Aplicativo Android de alta</tspan>
    <tspan x="80" dy="24">disponibilidade para postos de</tspan>
    <tspan x="80" dy="24">atendimento social, com senhas</tspan>
    <tspan x="80" dy="24">digitais e estimativa real de espera.</tspan>
  </text>
  <rect x="80" y="440" width="160" height="38" rx="6" fill="#141418" stroke="#2b2d31" stroke-width="1"/>
  <text x="96" y="464" fill="#ffffff" font-family="monospace" font-size="11">SLA MÉDIO: 8 MIN</text>

  <!-- Right stats panel on canvas -->
  <rect x="940" y="220" width="180" height="90" rx="8" fill="#141418" stroke="#2b2d31" stroke-width="1"/>
  <text x="956" y="248" fill="#8a8f98" font-family="monospace" font-size="9" letter-spacing="0.1em">ATENDIMENTOS / DIA</text>
  <text x="956" y="286" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="600">3.200+</text>

  <rect x="940" y="330" width="180" height="90" rx="8" fill="#141418" stroke="#2b2d31" stroke-width="1"/>
  <text x="956" y="358" fill="#8a8f98" font-family="monospace" font-size="9" letter-spacing="0.1em">QUEDA NO TEMPO DE FILA</text>
  <text x="956" y="396" fill="#22c55e" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="600">-62%</text>

  <rect x="940" y="440" width="180" height="90" rx="8" fill="#141418" stroke="#2b2d31" stroke-width="1"/>
  <text x="956" y="468" fill="#8a8f98" font-family="monospace" font-size="9" letter-spacing="0.1em">STATUS DO SERVIDOR</text>
  <text x="956" y="506" fill="#ffffff" font-family="monospace" font-size="14">ONLINE 99.98%</text>

  <!-- Phone Mockup in Center -->
  <!-- Outer Bezel -->
  <g transform="translate(425, 40)">
    <rect width="350" height="720" rx="46" fill="#1b1c20" stroke="#373940" stroke-width="3"/>
    <!-- Screen Glass -->
    <rect x="12" y="12" width="326" height="696" rx="36" fill="#0e0f13"/>
    
    <!-- Dynamic Island / Top Camera -->
    <rect x="125" y="22" width="100" height="26" rx="13" fill="#000000"/>
    <circle cx="205" cy="35" r="4.5" fill="#161820"/>
    <circle cx="205" cy="35" r="2" fill="#252b45"/>

    <!-- App Header -->
    <rect x="12" y="60" width="326" height="60" fill="#14151a"/>
    <line x1="12" y1="120" x2="338" y2="120" stroke="#2b2d31" stroke-width="1"/>
    <text x="32" y="92" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">CRAS Central • CadÚnico</text>
    <text x="32" y="108" fill="#8a8f98" font-family="monospace" font-size="10">UNIDADE DE ATENDIMENTO 01</text>

    <!-- Queue Status Card -->
    <rect x="28" y="140" width="294" height="200" rx="16" fill="#16171d" stroke="#2b2d31" stroke-width="1"/>
    
    <text x="48" y="172" fill="#8a8f98" font-family="monospace" font-size="10" letter-spacing="0.15em">SUA SENHA ATUAL</text>
    <text x="48" y="240" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="700" letter-spacing="-0.03em">A-042</text>
    <rect x="220" y="156" width="86" height="24" rx="12" fill="#c72c3b" fill-opacity="0.2"/>
    <text x="232" y="172" fill="#ff6b77" font-family="monospace" font-size="10" font-weight="600">PREFERENCIAL</text>

    <line x1="48" y1="265" x2="302" y2="265" stroke="#2b2d31" stroke-width="1"/>

    <text x="48" y="295" fill="#8a8f98" font-family="'Space Grotesk', sans-serif" font-size="11">Chamando no Guichê:</text>
    <text x="48" y="318" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600">Guichê 03 (Mesa Social)</text>

    <text x="210" y="295" fill="#8a8f98" font-family="'Space Grotesk', sans-serif" font-size="11">Tempo Estimado:</text>
    <text x="210" y="318" fill="#22c55e" font-family="monospace" font-size="14" font-weight="600">~ 6 min</text>

    <!-- People Ahead Indicator -->
    <rect x="28" y="356" width="294" height="54" rx="12" fill="#1a1c22" stroke="#2b2d31" stroke-width="1"/>
    <circle cx="52" cy="383" r="10" fill="#2b2d31"/>
    <text x="48" y="387" fill="#ffffff" font-family="monospace" font-size="10">2</text>
    <text x="74" y="388" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12">Pessoas na sua frente</text>
    <text x="240" y="388" fill="#8a8f98" font-family="monospace" font-size="10">FILA NORMAL: 14</text>

    <!-- Recent Calls Section -->
    <text x="32" y="442" fill="#8a8f98" font-family="monospace" font-size="10" letter-spacing="0.1em">ÚLTIMAS SENHAS CHAMADAS</text>

    <!-- Call 1 -->
    <rect x="28" y="456" width="294" height="42" rx="8" fill="#131418"/>
    <text x="44" y="482" fill="#ffffff" font-family="monospace" font-size="13" font-weight="600">A-041</text>
    <text x="120" y="482" fill="#8a8f98" font-family="'Space Grotesk', sans-serif" font-size="11">Guichê 02</text>
    <text x="250" y="482" fill="#22c55e" font-family="monospace" font-size="10">ATENDENDO</text>

    <!-- Call 2 -->
    <rect x="28" y="506" width="294" height="42" rx="8" fill="#131418"/>
    <text x="44" y="532" fill="#ffffff" font-family="monospace" font-size="13" font-weight="600">B-118</text>
    <text x="120" y="532" fill="#8a8f98" font-family="'Space Grotesk', sans-serif" font-size="11">Guichê 01</text>
    <text x="250" y="532" fill="#22c55e" font-family="monospace" font-size="10">ATENDENDO</text>

    <!-- Call 3 -->
    <rect x="28" y="556" width="294" height="42" rx="8" fill="#131418"/>
    <text x="44" y="582" fill="#8a8f98" font-family="monospace" font-size="13">B-117</text>
    <text x="120" y="582" fill="#6b7280" font-family="'Space Grotesk', sans-serif" font-size="11">Guichê 03</text>
    <text x="250" y="582" fill="#6b7280" font-family="monospace" font-size="10">FINALIZADO</text>

    <!-- Bottom Action Button -->
    <rect x="28" y="626" width="294" height="48" rx="12" fill="#c72c3b"/>
    <text x="100" y="656" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Ver Meus Documentos</text>
  </g>
</svg>