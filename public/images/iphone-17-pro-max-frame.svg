<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1280" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Titânio Claro / Natural Titanium (Prata Metálico Apple) -->
    <linearGradient id="silver-titanium" x1="0" y1="0" x2="620" y2="1280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="12%" stopColor="#e8e8ed" />
      <stop offset="35%" stopColor="#d5d5da" />
      <stop offset="50%" stopColor="#c5c5cb" />
      <stop offset="70%" stopColor="#dcdce0" />
      <stop offset="88%" stopColor="#e8e8ed" />
      <stop offset="100%" stopColor="#f8f8fa" />
    </linearGradient>

    <!-- Chanfro metálico polido e brilhante da borda externa -->
    <linearGradient id="silver-rim" x1="0" y1="0" x2="620" y2="1280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="25%" stopColor="#d0d0d5" />
      <stop offset="50%" stopColor="#9a9aa0" />
      <stop offset="75%" stopColor="#d0d0d5" />
      <stop offset="100%" stopColor="#ffffff" />
    </linearGradient>

    <!-- Brilho chanfrado interno CNC -->
    <linearGradient id="inner-rim" x1="0" y1="0" x2="0" y2="1280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#a0a0a8" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.8" />
    </linearGradient>

    <!-- Reflexo especular do chanfro superior -->
    <linearGradient id="top-specular-light" x1="80" y1="0" x2="540" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.2" />
      <stop offset="50%" stopColor="#ffffff" stopOpacity="1" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Botões laterais esquerdos em titânio claro polido -->
  <!-- Action Button -->
  <rect x="6.5" y="210" width="4" height="38" rx="2" fill="#dcdcde" stroke="#b0b2b8" stroke-width="0.8" />
  <!-- Volume Up -->
  <rect x="6.5" y="274" width="4" height="66" rx="2" fill="#dcdcde" stroke="#b0b2b8" stroke-width="0.8" />
  <!-- Volume Down -->
  <rect x="6.5" y="358" width="4" height="66" rx="2" fill="#dcdcde" stroke="#b0b2b8" stroke-width="0.8" />

  <!-- Botões laterais direitos em titânio claro polido -->
  <!-- Side / Power Button -->
  <rect x="609.5" y="270" width="4" height="98" rx="2" fill="#dcdcde" stroke="#b0b2b8" stroke-width="0.8" />
  <!-- Camera Control Capacitivo (iPhone 16 / 17 Pro Max) -->
  <rect x="609.5" y="880" width="3.5" height="78" rx="1.75" fill="#e8e8ec" stroke="#b0b2b8" stroke-width="0.8" />

  <!-- Chassi principal em Titânio Claro (Natural Titanium) com chanfro brilhante -->
  <rect x="10" y="8" width="600" height="1264" rx="66" ry="66" fill="url(#silver-titanium)" stroke="url(#silver-rim)" stroke-width="2" />

  <!-- Linha de antena sutil nas laterais -->
  <line x1="9" y1="140" x2="11.5" y2="140" stroke="#b0b2b8" stroke-width="1.8" />
  <line x1="9" y1="1140" x2="11.5" y2="1140" stroke="#b0b2b8" stroke-width="1.8" />
  <line x1="608.5" y1="140" x2="611" y2="140" stroke="#b0b2b8" stroke-width="1.8" />
  <line x1="608.5" y1="1140" x2="611" y2="1140" stroke="#b0b2b8" stroke-width="1.8" />

  <!-- Chanfro interno usinado em titânio polido -->
  <rect x="12" y="10" width="596" height="1260" rx="64" ry="64" fill="none" stroke="url(#inner-rim)" stroke-width="1.2" />

  <!-- Borda preta ultrafina da tela OLED (bezels de ~1.15mm do iPhone 17 Pro Max) -->
  <rect x="18" y="16" width="584" height="1248" rx="55" ry="55" fill="#000000" stroke="#000000" stroke-width="2" />

  <!-- Abertura do alto-falante auricular superior -->
  <rect x="274" y="13.5" width="72" height="2.5" rx="1.25" fill="#1c1c20" />

  <!-- Brilho especular sutil na borda superior da moldura -->
  <path d="M 120 9 Q 310 7 500 9" stroke="url(#top-specular-light)" stroke-width="1.4" fill="none" />
</svg>
