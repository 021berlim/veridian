<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1280" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradiente do titânio escuro / space black com reflexo sutil nas bordas -->
    <linearGradient id="titanium-band" x1="0" y1="0" x2="620" y2="1280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2c2d32" />
      <stop offset="15%" stopColor="#1a1b1e" />
      <stop offset="50%" stopColor="#121315" />
      <stop offset="85%" stopColor="#1a1b1e" />
      <stop offset="100%" stopColor="#26272b" />
    </linearGradient>

    <!-- Chanfro metálico polido externo -->
    <linearGradient id="chamfer-rim" x1="0" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#45474e" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#202125" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#45474e" stopOpacity="0.8" />
    </linearGradient>

    <!-- Brilho especular sutil na borda superior -->
    <linearGradient id="top-specular" x1="100" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2c2d32" stopOpacity="0" />
      <stop offset="50%" stopColor="#585a63" stopOpacity="0.7" />
      <stop offset="100%" stopColor="#2c2d32" stopOpacity="0" />
    </linearGradient>

    <!-- Sombra de relevo da moldura -->
    <filter id="chassis-shadow" x="-5%" y="-3%" width="110%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="28" stdDeviation="35" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#chassis-shadow)">
    <!-- Botões laterais esquerdos: Action Button, Volume + e Volume - -->
    <!-- Action Button -->
    <rect x="7" y="210" width="3.5" height="38" rx="1.75" fill="#232428" stroke="#3d3f46" stroke-width="0.8" />
    <!-- Volume Up -->
    <rect x="7" y="274" width="3.5" height="66" rx="1.75" fill="#232428" stroke="#3d3f46" stroke-width="0.8" />
    <!-- Volume Down -->
    <rect x="7" y="358" width="3.5" height="66" rx="1.75" fill="#232428" stroke="#3d3f46" stroke-width="0.8" />

    <!-- Botões laterais direitos: Power Button e Camera Control Capacitivo -->
    <!-- Power / Side Button -->
    <rect x="609.5" y="270" width="3.5" height="98" rx="1.75" fill="#232428" stroke="#3d3f46" stroke-width="0.8" />
    <!-- Camera Control (iPhone 16 / 17 Pro Max) -->
    <rect x="609.5" y="880" width="3.2" height="78" rx="1.6" fill="#18191c" stroke="#38393e" stroke-width="0.8" />

    <!-- Corpo principal de titânio (Grade 5 Titanium) -->
    <rect x="10" y="8" width="600" height="1264" rx="66" ry="66" fill="url(#titanium-band)" stroke="url(#chamfer-rim)" stroke-width="1.8" />

    <!-- Linhas de antena imperceptíveis nas laterais -->
    <line x1="9" y1="140" x2="11.5" y2="140" stroke="#0a0a0c" stroke-width="2" />
    <line x1="9" y1="1140" x2="11.5" y2="1140" stroke="#0a0a0c" stroke-width="2" />
    <line x1="608.5" y1="140" x2="611" y2="140" stroke="#0a0a0c" stroke-width="2" />
    <line x1="608.5" y1="1140" x2="611" y2="1140" stroke="#0a0a0c" stroke-width="2" />

    <!-- Chanfro interno usinado em CNC -->
    <rect x="11.5" y="9.5" width="597" height="1261" rx="64.5" ry="64.5" fill="none" stroke="#121316" stroke-width="1.5" />

    <!-- Borda ultrafina da tela (Borders de ~1.15mm do iPhone 17 Pro Max) -->
    <rect x="19" y="17" width="582" height="1246" rx="55" ry="55" fill="none" stroke="#000000" stroke-width="5" />

    <!-- Abertura do alto-falante / microfone superior ultrafina -->
    <rect x="275" y="13.5" width="70" height="2.5" rx="1.25" fill="#08080a" />
  </g>

  <!-- Brilho no topo -->
  <path d="M 120 9 Q 310 7 500 9" stroke="url(#top-specular)" stroke-width="1.2" fill="none" />
</svg>
